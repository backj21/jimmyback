name: Refresh GitHub activity
on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: github-activity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify data handling
        run: node --test tests/*.test.mjs
      - name: Refresh contribution snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/refresh-github-activity.mjs
      - name: Commit updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github-activity.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh GitHub contribution activity'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/backj21/jimmyback/pages/builds
